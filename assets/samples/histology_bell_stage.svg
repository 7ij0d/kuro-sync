<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background Histological Glass Slide Pink H&E Tint -->
  <rect width="400" height="300" fill="#F8E7EE"/>
  <!-- Connective tissue stroma / ectomesenchyme -->
  <g opacity="0.35" fill="#E8B4C8">
    <circle cx="50" cy="50" r="14"/>
    <circle cx="120" cy="40" r="18"/>
    <circle cx="340" cy="80" r="22"/>
    <circle cx="360" cy="220" r="16"/>
    <circle cx="70" cy="240" r="20"/>
  </g>
  <!-- Dental Follicle / Sac -->
  <path d="M 60 260 Q 200 40 340 260" fill="none" stroke="#C46D93" stroke-width="6" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Enamel Organ (Bell Stage) Outer & Inner Enamel Epithelium -->
  <path d="M 90 250 C 100 120 160 80 200 80 C 240 80 300 120 310 250 C 270 210 240 150 200 150 C 160 150 130 210 90 250 Z" fill="#D382A6" stroke="#9A3B66" stroke-width="4"/>
  <!-- Stellate Reticulum (Star-shaped mesh) -->
  <path d="M 120 180 L 140 140 L 180 120 L 220 120 L 260 140 L 280 180" fill="none" stroke="#B85D85" stroke-width="2" opacity="0.7"/>
  <!-- Dental Papilla (Odontoblasts formation core) -->
  <path d="M 130 250 C 150 190 180 170 200 170 C 220 170 250 190 270 250 Z" fill="#EFA9C5" stroke="#BA4E7A" stroke-width="3"/>
  <!-- Microscopic cellular nuclei -->
  <g fill="#7A2247" opacity="0.8">
    <circle cx="160" cy="190" r="3"/>
    <circle cx="180" cy="180" r="3.5"/>
    <circle cx="200" cy="175" r="3.5"/>
    <circle cx="220" cy="180" r="3.5"/>
    <circle cx="240" cy="190" r="3"/>
    <circle cx="190" cy="210" r="3"/>
    <circle cx="210" cy="210" r="3"/>
  </g>
  <text x="20" y="285" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#7A2247" opacity="0.7">H&amp;E Stain • Tooth Development (Bell Stage)</text>
</svg>
